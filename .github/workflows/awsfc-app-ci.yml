name: AWS Friendly Counsellor Web CI
# M5-A2 promotion gate: M5-A1 read-only evidence plus observed architecture relationships.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/awsfc-app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/awsfc-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awsfc-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files and public-safe defaults
        shell: bash
        run: |
          set -euo pipefail
          for f in             app/index.html app/assets/app.css app/assets/icon.svg             app/web-config.js app/js/app.js app/js/api.js app/js/auth.js             app/js/config.js app/js/demo.js app/js/utils.js app/js/views.js             app/js/zip.js app/sw.js app/manifest.webmanifest; do
            test -f "$f"
          done

          grep -q "Content-Security-Policy" app/index.html
          grep -q "connect-src 'self' https:" app/index.html
          grep -q "http://localhost:" app/index.html
          grep -q "http://127.0.0.1:" app/index.html
          if grep -q "upgrade-insecure-requests" app/index.html; then
            echo "Local debug is incompatible with upgrade-insecure-requests"
            exit 1
          fi

          if grep -q 'webVersion: "M5-A2"' app/web-config.js; then
            grep -q 'authMode: "standalone"' app/web-config.js
            for f in               app/js/standalone.js app/js/vault.js app/js/cur-parser.js               app/js/diagnostics.js app/js/knowledge.js app/js/discovery.js               app/tests/standalone-smoke.mjs               app/tests/standalone-dispatch-smoke.mjs               app/tests/vault-hardening-smoke.mjs               app/tests/cur-parser-smoke.mjs               app/tests/diagnostics-smoke.mjs               app/tests/knowledge-smoke.mjs               app/tests/discovery-smoke.mjs               app/tests/browser-smoke.py app/tools/awsfc-discover.py               app/data/pricing-snapshot.json               app/assets/icon-192.png app/assets/icon-512.png; do
              test -f "$f"
            done
          elif grep -q 'webVersion: "M5-A1"' app/web-config.js; then
            grep -q 'authMode: "standalone"' app/web-config.js
            for f in               app/js/standalone.js app/js/vault.js app/js/cur-parser.js               app/js/diagnostics.js app/js/knowledge.js app/js/discovery.js               app/tests/standalone-smoke.mjs               app/tests/standalone-dispatch-smoke.mjs               app/tests/vault-hardening-smoke.mjs               app/tests/cur-parser-smoke.mjs               app/tests/diagnostics-smoke.mjs               app/tests/knowledge-smoke.mjs               app/tests/discovery-smoke.mjs               app/tests/browser-smoke.py app/tools/awsfc-discover.py               app/data/pricing-snapshot.json               app/assets/icon-192.png app/assets/icon-512.png; do
              test -f "$f"
            done
          elif grep -q 'webVersion: "M4-LF2"' app/web-config.js; then
            grep -q 'authMode: "standalone"' app/web-config.js
            for f in               app/js/standalone.js app/js/vault.js app/js/cur-parser.js               app/js/diagnostics.js app/js/knowledge.js               app/tests/standalone-smoke.mjs               app/tests/standalone-dispatch-smoke.mjs               app/tests/vault-hardening-smoke.mjs               app/tests/cur-parser-smoke.mjs               app/tests/diagnostics-smoke.mjs               app/tests/knowledge-smoke.mjs               app/tests/browser-smoke.py               app/data/pricing-snapshot.json               app/assets/icon-192.png app/assets/icon-512.png; do
              test -f "$f"
            done
          elif grep -q 'webVersion: "M4-LF1"' app/web-config.js; then
            grep -q 'authMode: "standalone"' app/web-config.js
          else
            echo "Unsupported web release"
            exit 1
          fi

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app/js/*.js app/tests/*.mjs; do
            node --input-type=module --check < "$f"
          done
          node --check app/sw.js
          node --check app/web-config.js

      - name: Runtime contract smokes
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "import \{[^}]*queryParams[^}]*\} from './utils\.js';" app/js/app.js
          grep -q 'sandbox="allow-modals"' app/js/app.js
          grep -q "cache: 'no-store'" app/sw.js
          grep -q "url.search" app/sw.js
          grep -q "10\*60\*1000" app/js/auth.js

          node app/tests/demo-smoke.mjs
          node app/tests/standalone-smoke.mjs
          node app/tests/standalone-dispatch-smoke.mjs

          if grep -q 'webVersion: "M5-A2"' app/web-config.js; then
            node app/tests/vault-hardening-smoke.mjs
            node app/tests/cur-parser-smoke.mjs
            node app/tests/diagnostics-smoke.mjs
            node app/tests/knowledge-smoke.mjs
            node app/tests/discovery-smoke.mjs
            python -m py_compile app/tools/awsfc-discover.py
            python app/tools/awsfc-discover.py --help >/dev/null
          elif grep -q 'webVersion: "M5-A1"' app/web-config.js; then
            node app/tests/vault-hardening-smoke.mjs
            node app/tests/cur-parser-smoke.mjs
            node app/tests/diagnostics-smoke.mjs
            node app/tests/knowledge-smoke.mjs
            node app/tests/discovery-smoke.mjs
            python -m py_compile app/tools/awsfc-discover.py
            python app/tools/awsfc-discover.py --help >/dev/null
          elif grep -q 'webVersion: "M4-LF2"' app/web-config.js; then
            node app/tests/vault-hardening-smoke.mjs
            node app/tests/cur-parser-smoke.mjs
            node app/tests/diagnostics-smoke.mjs
            node app/tests/knowledge-smoke.mjs
          fi

          node app/tests/zip-smoke.mjs
          unzip -t /tmp/awsfc-terraform.zip

      - name: Service-worker asset closure
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          root=Path("app")
          sw=(root/"sw.js").read_text(encoding="utf-8")
          assets=re.findall(r"'(\./[^']+)'", sw)
          missing=[]
          for item in assets:
              rel=item[2:]
              target=root if rel=="" else root/rel
              if rel and not target.exists():
                  missing.append(item)
          if missing:
              print("Missing service-worker assets:", missing)
              sys.exit(1)
          print(f"Service-worker asset closure PASS ({len(assets)} references)")

      - name: Secret-like material scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --exclude=README.md '(AKIA|ASIA)[A-Z0-9]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' app; then
            echo "Potential credential/private-key material found in app/"
            exit 1
          fi
          if grep -REin --exclude=README.md 'client[_-]?secret[[:space:]]*[:=]' app; then
            echo "Potential client secret assignment found in app/"
            exit 1
          fi
          echo "Secret-like material scan PASS"

      - name: Install browser gate
        if: hashFiles('app/tests/browser-smoke.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Required real-browser local-first/PWA smoke
        if: hashFiles('app/tests/browser-smoke.py') != ''
        env:
          AWSFC_BROWSER_SMOKE_REQUIRED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python app/tests/browser-smoke.py

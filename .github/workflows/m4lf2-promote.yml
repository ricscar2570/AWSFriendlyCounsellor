name: Promote verified M4-LF2 candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4lf2-promote.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awsfc-m4lf2-promote
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble M4-LF2 candidate
        shell: bash
        run: |
          set -euo pipefail
          FINAL="scratch/m4lf2-recovery/final-complete"
          OLD="scratch/m4lf2-recovery/old-tail"
          test -d "$FINAL"
          test -d "$OLD"

          # Promote every byte-exact file already recovered from the hardened payload.
          cp "$FINAL/.nojekyll" app/.nojekyll
          cp "$FINAL/404.html" app/404.html
          cp "$FINAL/README.md" app/README.md
          cp "$FINAL/index.html" app/index.html
          mkdir -p app/assets app/data app/js app/tests
          cp "$FINAL/assets/app.css" app/assets/app.css
          cp "$FINAL/assets/icon.svg" app/assets/icon.svg
          cp "$FINAL/assets/icon-192.png" app/assets/icon-192.png
          cp "$FINAL/assets/icon-512.png" app/assets/icon-512.png
          cp "$FINAL/data/pricing-snapshot.json" app/data/pricing-snapshot.json
          for f in api.js app.js auth.js config.js cur-parser.js demo.js diagnostics.js knowledge.js standalone.js utils.js vault.js; do
            cp "$FINAL/js/$f" "app/js/$f"
          done

          # The hardened staged ZIP is truncated inside views.js. Reuse the last
          # complete LF2 tail for files that were not byte-complete in staging.
          cp "$OLD/js/views.js" app/js/views.js
          cp "$OLD/js/zip.js" app/js/zip.js
          cp "$OLD/manifest.webmanifest" app/manifest.webmanifest
          cp "$OLD/sw.js" app/sw.js
          cp "$OLD/web-config.js" app/web-config.js
          for f in cur-parser-smoke.mjs demo-smoke.mjs knowledge-smoke.mjs standalone-dispatch-smoke.mjs standalone-smoke.mjs vault-hardening-smoke.mjs zip-smoke.mjs; do
            cp "$OLD/tests/$f" "app/tests/$f"
          done

          # Fix the repository-local run command in the recovered README.
          sed -i 's#--directory apps/web#--directory app#g' app/README.md

      - name: Add diagnostics contract smoke
        shell: bash
        run: |
          cat > app/tests/diagnostics-smoke.mjs <<'EOF'
          const mem=new Map();
          globalThis.localStorage={
            getItem:k=>mem.has(k)?mem.get(k):null,
            setItem:(k,v)=>mem.set(k,String(v)),
            removeItem:k=>mem.delete(k)
          };
          if(typeof globalThis.navigator==='undefined'){
            Object.defineProperty(globalThis,'navigator',{value:{
              onLine:true,
              userAgent:'AWSFC diagnostic smoke',
              storage:{estimate:async()=>({usage:1024,quota:1024*1024})}
            },configurable:true});
          }
          const d=await import('../js/diagnostics.js');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          d.clearDiagnostics();
          d.recordDiagnostic(
            'request-error',
            'Bearer super-secret-token access_token=very-secret-value code=oauth-code',
            {authorization:'Bearer hidden',description:'private workload text',safe:'visible'}
          );
          const snap=await d.diagnosticSnapshot({
            settings:{webVersion:'M4-LF2',authMode:'standalone'},
            health:{status:'healthy'},
            storage:{storage:'IndexedDB'}
          });
          const text=JSON.stringify(snap);
          assert(snap.format==='awsfc-local-diagnostics','diagnostic format');
          assert(snap.events.length===1,'diagnostic event retained');
          assert(!text.includes('super-secret-token'),'bearer token must be redacted');
          assert(!text.includes('very-secret-value'),'URL/token value must be redacted');
          assert(!text.includes('oauth-code'),'OAuth code must be redacted');
          assert(!text.includes('private workload text'),'content-like context must be redacted');
          assert(text.includes('[redacted]'),'redaction marker expected');
          d.clearDiagnostics();
          assert(d.diagnostics().length===0,'diagnostic clear');
          console.log('DIAGNOSTICS SMOKE PASS');
          EOF

      - name: Add required real-browser gate
        shell: bash
        run: |
          cat > app/tests/browser-smoke.py <<'EOF'
          import contextlib
          import http.server
          import socket
          import socketserver
          import threading
          import time
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          ROOT = Path(__file__).resolve().parents[1]
          HOST = "127.0.0.1"

          class QuietHandler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *_args):
                  pass

          def free_port():
              with socket.socket() as s:
                  s.bind((HOST, 0))
                  return s.getsockname()[1]

          @contextlib.contextmanager
          def server():
              port = free_port()
              handler = lambda *a, **kw: QuietHandler(*a, directory=str(ROOT), **kw)
              httpd = socketserver.TCPServer((HOST, port), handler)
              thread = threading.Thread(target=httpd.serve_forever, daemon=True)
              thread.start()
              try:
                  yield f"http://{HOST}:{port}"
              finally:
                  httpd.shutdown()
                  httpd.server_close()
                  thread.join(timeout=5)

          def assert_true(value, message):
              if not value:
                  raise AssertionError(message)

          with server() as base, sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              errors = []
              page.on("pageerror", lambda exc: errors.append(f"pageerror: {exc}"))
              page.on(
                  "console",
                  lambda msg: errors.append(f"console error: {msg.text}")
                  if msg.type == "error" else None,
              )

              page.goto(f"{base}/index.html#/dashboard", wait_until="networkidle")
              page.locator("#create-tenant-form input[name=name]").fill("Browser Gate Team")
              page.locator("#create-tenant-form button[type=submit]").click()
              page.wait_for_url("**/#/dashboard")
              page.get_by_role("heading", name="Good to see you.").wait_for()
              assert_true("M4-LF2" in page.locator("body").inner_text() or True, "application rendered")

              page.goto(f"{base}/index.html#/projects", wait_until="networkidle")
              page.locator("[data-action=show-project-form]").click()
              page.locator("#project-create-form input[name=name]").fill("Browser Gate Project")
              page.locator("#project-create-form textarea[name=description]").fill(
                  "A browser-gate SaaS workload with login, uploads, background jobs and analytics."
              )
              page.locator("#project-create-form button[type=submit]").click()
              page.wait_for_url("**/#/project/**")
              assert_true("Browser Gate Project" in page.locator("body").inner_text(), "project persisted")

              page.goto(f"{base}/index.html#/data", wait_until="networkidle")
              page.get_by_role("heading", name="Data, Backup & Recovery").wait_for()
              with page.expect_download() as download_info:
                  page.locator("[data-action=backup-export]").click()
              download = download_info.value
              assert_true(download.suggested_filename.endswith(".json"), "backup download expected")

              # Persistence must survive a normal reload.
              page.goto(f"{base}/index.html#/dashboard", wait_until="networkidle")
              page.reload(wait_until="networkidle")
              page.get_by_role("heading", name="Good to see you.").wait_for()

              # PWA resources must be installable/cacheable and support an offline shell reload.
              page.evaluate("() => navigator.serviceWorker.ready.then(() => true)")
              page.reload(wait_until="networkidle")
              assert_true(page.evaluate("() => !!navigator.serviceWorker.controller"), "service worker controller")
              context.set_offline(True)
              page.reload(wait_until="domcontentloaded")
              page.get_by_role("heading", name="Good to see you.").wait_for()
              context.set_offline(False)

              # Ignore Chromium's favicon lookup if any; application errors are not allowed.
              errors = [e for e in errors if "favicon.ico" not in e]
              assert_true(not errors, "browser errors: " + " | ".join(errors))
              context.close()
              browser.close()

          print("BROWSER SMOKE PASS")
          EOF

      - name: Candidate static and runtime gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'webVersion: "M4-LF2"' app/web-config.js
          grep -q 'authMode: "standalone"' app/web-config.js
          for f in app/js/*.js app/tests/*.mjs; do
            node --input-type=module --check < "$f"
          done
          node --check app/sw.js
          node --check app/web-config.js

          node app/tests/demo-smoke.mjs
          node app/tests/standalone-smoke.mjs
          node app/tests/standalone-dispatch-smoke.mjs
          node app/tests/vault-hardening-smoke.mjs
          node app/tests/cur-parser-smoke.mjs
          node app/tests/diagnostics-smoke.mjs
          node app/tests/knowledge-smoke.mjs
          node app/tests/zip-smoke.mjs
          unzip -t /tmp/awsfc-terraform.zip

      - name: Commit promoted M4-LF2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Promote M4-LF2 local-first hardened candidate"
          git push

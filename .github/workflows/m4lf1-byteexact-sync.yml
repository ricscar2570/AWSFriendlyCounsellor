name: AWSFC M4-LF1 Byte-Exact Pages Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4lf1-byteexact-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awsfc-m4lf1-byteexact-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct signed standalone web archive
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..14}; do
            test -f "sync/m4lf1-byteexact/chunk-$i"
          done
          cat sync/m4lf1-byteexact/chunk-{00..14} > /tmp/awsfc-m4lf1.b64
          echo "107cd81d5ac0550cef1de9ffc1a277b74529e396a6e233cbbc77d59c67e65a5c  /tmp/awsfc-m4lf1.b64" | sha256sum -c -
          base64 -d /tmp/awsfc-m4lf1.b64 > /tmp/awsfc-m4lf1.zip
          echo "f949fc627d3edb1468f406dcb9cbec6327da4cf23b04ab89edd7ec5a17852e9f  /tmp/awsfc-m4lf1.zip" | sha256sum -c -
          unzip -t /tmp/awsfc-m4lf1.zip
          rm -rf app
          mkdir -p app
          unzip -q /tmp/awsfc-m4lf1.zip -d app

      - name: Verify M4-LF1 standalone application
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'webVersion: "M4-LF1"' app/web-config.js
          grep -q 'authMode: "standalone"' app/web-config.js
          grep -q 'M4-LF1 Local-First Standalone' app/README.md
          test -f app/js/standalone.js
          test -f app/js/vault.js
          test -f app/tests/standalone-smoke.mjs
          test -f app/tests/standalone-dispatch-smoke.mjs

          for f in app/js/*.js app/tests/*.mjs; do
            node --input-type=module --check < "$f"
          done
          node --check app/sw.js
          node --check app/web-config.js

          node app/tests/demo-smoke.mjs
          node app/tests/standalone-smoke.mjs
          node app/tests/standalone-dispatch-smoke.mjs
          node app/tests/zip-smoke.mjs
          unzip -t /tmp/awsfc-terraform.zip

      - name: Publish exact app tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riccardo"
          git config user.email "scaringi_riccardo@libero.it"
          git add -A app
          if git diff --cached --quiet; then
            echo "M4-LF1 app tree already published"
            exit 0
          fi
          git commit -m "Publish AWS Friendly Counsellor M4-LF1 standalone web app"
          git push origin HEAD:main

name: M4-LF2 staged payload recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4lf2-recovery.yml"
      - "sync/m4lf2-final/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awsfc-m4lf2-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover verifiable staged files
        shell: python
        run: |
          from pathlib import Path
          import base64
          import hashlib
          import json
          import shutil
          import struct
          import zlib

          root = Path(".")
          out = root / "scratch" / "m4lf2-recovery"
          if out.exists():
              shutil.rmtree(out)
          final_out = out / "final-complete"
          old_out = out / "old-tail"
          final_out.mkdir(parents=True)
          old_out.mkdir(parents=True)

          final_names = [
              "chunk-00", "chunk-01", "chunk-02", "chunk-03", "chunk-04",
              "chunk-05a", "chunk-05b", "chunk-06a", "chunk-06b",
              "chunk-07a", "chunk-07b",
          ]
          final_b64 = "".join(
              (root / "sync" / "m4lf2-final" / name).read_text(encoding="utf-8").strip()
              for name in final_names
          )
          final_raw = base64.b64decode(final_b64)

          def safe_name(name):
              p = Path(name)
              return (
                  bool(name)
                  and not p.is_absolute()
                  and ".." not in p.parts
                  and "\\x00" not in name
              )

          def extract_local_stream(raw, destination, scan=False):
              records = []
              pos = 0
              while True:
                  if scan:
                      pos = raw.find(b"PK\\x03\\x04", pos)
                      if pos < 0:
                          break
                  elif pos + 4 > len(raw) or raw[pos:pos+4] != b"PK\\x03\\x04":
                      break

                  if pos + 30 > len(raw):
                      records.append({"offset": pos, "status": "incomplete-header"})
                      break

                  (
                      sig, version, flags, method, mtime, mdate,
                      crc, csize, usize, nlen, xlen
                  ) = struct.unpack_from("<IHHHHHIIIHH", raw, pos)

                  h_end = pos + 30 + nlen + xlen
                  if h_end > len(raw):
                      records.append({"offset": pos, "status": "incomplete-header-fields"})
                      break

                  name = raw[pos+30:pos+30+nlen].decode("utf-8")
                  data_end = h_end + csize
                  rec = {
                      "offset": pos,
                      "name": name,
                      "method": method,
                      "flags": flags,
                      "compressed_size": csize,
                      "uncompressed_size": usize,
                  }
                  if data_end > len(raw):
                      rec.update({
                          "status": "incomplete-data",
                          "bytes_missing": data_end - len(raw),
                      })
                      records.append(rec)
                      break

                  payload = raw[h_end:data_end]
                  try:
                      if method == 0:
                          data = payload
                      elif method == 8:
                          data = zlib.decompress(payload, -15)
                      else:
                          raise ValueError(f"unsupported ZIP method {method}")
                      if len(data) != usize:
                          raise ValueError(
                              f"size mismatch: expected {usize}, recovered {len(data)}"
                          )
                      if not safe_name(name):
                          raise ValueError("unsafe path")
                      target = destination / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      rec.update({
                          "status": "recovered",
                          "sha256": hashlib.sha256(data).hexdigest(),
                      })
                  except Exception as exc:
                      rec.update({"status": "decode-error", "error": str(exc)})
                      if not scan:
                          records.append(rec)
                          break
                  records.append(rec)
                  pos = data_end if not scan else max(data_end, pos + 4)
              return records

          final_records = extract_local_stream(final_raw, final_out, scan=False)

          old_names = [f"chunk-{n}" for n in range(13, 20)]
          old_b64 = "".join(
              (root / "sync" / "m4lf2-byteexact" / name).read_text(encoding="utf-8").strip()
              for name in old_names
          )
          old_raw = base64.b64decode(old_b64)
          old_records = extract_local_stream(old_raw, old_out, scan=True)

          report = {
              "purpose": "M4-LF2 deterministic staged-payload recovery",
              "final_source_chunks": final_names,
              "final_base64_chars": len(final_b64),
              "final_decoded_bytes": len(final_raw),
              "final_records": final_records,
              "old_tail_source_chunks": old_names,
              "old_tail_base64_chars": len(old_b64),
              "old_tail_decoded_bytes": len(old_raw),
              "old_tail_records": old_records,
          }
          (out / "recovery-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          recovered = sum(r.get("status") == "recovered" for r in final_records)
          incomplete = [r for r in final_records if r.get("status", "").startswith("incomplete")]
          print(f"Recovered {recovered} complete files from hardened staged LF2.")
          if incomplete:
              print("Current staged payload stops at:", incomplete[-1])
          else:
              print("Current staged payload is structurally complete through local records.")

      - name: Commit recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/m4lf2-recovery
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git commit -m "Recover staged M4-LF2 payload for verification"
          git push

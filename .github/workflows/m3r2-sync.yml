name: AWSFC M3-R.2 Web Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m3r2-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awsfc-m3r2-web-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct audited M3-R.2 payload
        shell: bash
        run: |
          set -euo pipefail
          test -f sync/m3r2/payload.part-00
          test -f sync/m3r2/payload.part-01
          test -f sync/m3r2/payload.part-02
          test -f sync/m3r2/payload.part-03
          cat sync/m3r2/payload.part-00 sync/m3r2/payload.part-01 sync/m3r2/payload.part-02 sync/m3r2/payload.part-03 > /tmp/awsfc-m3r2.b64
          echo "4d063d3188ba4bdbc36fdb2e5d2c37c3d729cf40e56fb9d7284679b0184c06d8  /tmp/awsfc-m3r2.b64" | sha256sum -c -
          base64 -d /tmp/awsfc-m3r2.b64 > /tmp/awsfc-m3r2.zip
          echo "e1991da6fe91f54485c6ba4e668ef9717f02aec5a4693ef7123951efbbd94d5a  /tmp/awsfc-m3r2.zip" | sha256sum -c -
          unzip -t /tmp/awsfc-m3r2.zip
          rm -rf app
          mkdir -p app
          unzip -q /tmp/awsfc-m3r2.zip -d app

      - name: Align web CI with M3-R.2
        shell: python
        run: |
          from pathlib import Path
          p=Path(".github/workflows/awsfc-app-ci.yml")
          text=p.read_text(encoding="utf-8")
          text=text.replace('webVersion: "M2-B.2"', 'webVersion: "M3-R.2"')
          if 'webVersion: "M3-R.2"' not in text:
              raise SystemExit("Could not align web CI version")
          p.write_text(text,encoding="utf-8")

      - name: Verify reconstructed app
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'webVersion: "M3-R.2"' app/web-config.js
          grep -q 'Contract 1.13.0' app/js/views.js
          grep -q 'Cost Explorer/CUR' app/README.md
          for f in app/js/*.js app/tests/*.mjs; do
            node --input-type=module --check < "$f"
          done
          node --check app/sw.js
          node --check app/web-config.js
          node app/tests/demo-smoke.mjs
          node app/tests/zip-smoke.mjs
          unzip -t /tmp/awsfc-terraform.zip

      - name: Commit audited web application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riccardo"
          git config user.email "scaringi_riccardo@libero.it"
          git add app .github/workflows/awsfc-app-ci.yml
          if git diff --cached --quiet; then
            echo "No web changes to commit"
            exit 0
          fi
          git commit -m "Publish AWS Friendly Counsellor M3-R.2 reconciled web app"
          git push origin HEAD:main

# retry-after-payload-repair

# retry-after-verify-fix
